zerops:
  - setup: relay
    build:
      base: nodejs@22
      buildCommands:
        # buildFromGit clones the whole monorepo; pnpm's workspace resolves
        # infra/relay's @t3tools/* siblings from here.
        - corepack enable
        - pnpm install --frozen-lockfile
        - cd infra/relay && pnpm run typecheck
      deployFiles:
        - infra/relay/src
        - infra/relay/scripts
        - infra/relay/migrations
        - infra/relay/package.json
        - infra/relay/tsconfig.json
        - node_modules
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        - tsconfig.base.json
        - packages
    run:
      base: nodejs@22
      ports:
        - port: 8080
          httpSupport: true
      initCommands:
        - cd infra/relay && pnpm run migrate
      start: cd infra/relay && pnpm run start
      envVariables:
        PORT: 8080
        HOST: 0.0.0.0
        # Filled in from the paired PostgreSQL service (see
        # zerops-import.yml's envVariables cross-reference) once imported;
        # a manual deploy must set this to the target Postgres service's
        # generated connection string.
        DATABASE_URL: ${db_connectionString}
        RELAY_ISSUER: ${zeropsSubdomain}
        # Secrets: set these on the service before the first deploy. Never
        # commit real values.
        CLOUD_MINT_PRIVATE_KEY: ${CLOUD_MINT_PRIVATE_KEY}
        CLOUD_MINT_PUBLIC_KEY: ${CLOUD_MINT_PUBLIC_KEY}
        APNS_DELIVERY_JOB_SIGNING_SECRET: ${APNS_DELIVERY_JOB_SIGNING_SECRET}
        APNS_ENVIRONMENT: ${APNS_ENVIRONMENT}
        APNS_TEAM_ID: ${APNS_TEAM_ID}
        APNS_KEY_ID: ${APNS_KEY_ID}
        APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
        APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY}
